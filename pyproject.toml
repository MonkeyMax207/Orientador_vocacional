# pyproject.toml — declares the project's Python version and dependencies.
# uv reads this to build .venv/ and writes exact versions to uv.lock (commit both).
[project]
name = "orientador-voz"
version = "0.1.0"
requires-python = ">=3.11,<3.12"   # Raspberry Pi OS Bookworm ships 3.11; match it everywhere
dependencies = [
    "numpy",            # audio buffers are numpy arrays
    "sounddevice",      # microphone + speaker via PortAudio
    "onnxruntime",      # runs the Silero VAD model (and Piper internally)
    "faster-whisper",   # speech-to-text (CTranslate2 engine, fast on CPU and GPU)
    "piper-tts==1.3.0", # text-to-speech; pinned because its Python API changed in 1.3
    # CUDA 12 math libraries that faster-whisper needs for the GPU. Only on x86-64 PCs:
    # they don't exist for the Pi's ARM CPU, and the marker keeps `uv sync` working there.
    "nvidia-cublas-cu12; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9,<10; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
]
