# Settings for the voice agent.
# [common] applies to every profile; a profile section ([pc] or [pi]) adds or overrides keys.
# Choose the profile when starting:  uv run python main.py pc

[common]
# Audio devices: any words from the device name printed by `uv run python list_devices.py`.
# "MME" selects the Windows audio API that converts sample rates for us (the USB module
# runs at 48 kHz, we want 16 kHz). On Linux these names change (sub-project 3).
input_device = "USB PnP MME"
output_device = "USB PnP MME"
vad_threshold = 0.5          # Silero speech probability above which a 32 ms chunk counts as speech
silence_ms = 600             # this much silence ends the user's turn (lower = snappier, but cuts pauses)
min_speech_ms = 250          # turns with less speech than this are noise (a click, a cough)
filler_after_s = 0.0         # "Jum..." + thinking animation right when the user stops talking
slow_llm_s = 4.0             # still nothing this long after the user stopped → one more filler
# 127.0.0.1, not "localhost": on Windows "localhost" tries IPv6 (::1) first, Ollama only
# listens on IPv4, and every request would wait ~2 s for the IPv6 attempt to time out.
ollama_host = "http://127.0.0.1:11434"
llm_backend = "ollama"       # "ollama" or "nim"; only [dgx] overrides this today
nim_host = ""                 # unused unless llm_backend = "nim" (set per-profile, e.g. [dgx])
# Brain ↔ voice link (server.py runs on the brain machine, client.py on the voice machine). The DGX's
# Tailscale IP: works the same whether the voice machine (PC or Pi) is on the home LAN or elsewhere
# (e.g. the Pi at university) — both just need `tailscale up` with the same account. See §10/§10.1.
server_port = 8765
server_url = "ws://100.93.200.74:8765"
# Knowledge (RAG) — see docs/superpowers/specs/2026-09-26-uao-knowledge-rag-design.md
embed_model = "embeddinggemma"   # Ollama embedding model (CPU); 21/25 in knowledge/eval.py, cleanest off-topic rejection
# Motor de recuperacion: "embed" (semantico, necesita un modelo de embeddings cargado),
# "bm25" (lexico, 0.11 ms por consulta y sin modelo) o "ninguno".
rag_backend = "embed"
rag_gate_bm25 = 1.0          # puntaje BM25 minimo; por debajo no se entrega nada y el robot dice que no sabe
rag_card_chars = 0           # recorte por documento recuperado; 0 = completo. Solo la Pi lo necesita
rag_fragmentos = 0           # >0 = entregar N franjas del documento en vez del documento entero
rag_gate_charla = 6.0        # umbral cuando no hay carrera en foco: la charla puntua 0-4.8, una pregunta UAO 7.6+
max_tokens = 200             # tope de la respuesta; la Pi lo baja porque cada ficha son ~0,16 s alli
max_turns = 10               # intercambios recordados; acota el prompt y por tanto la espera
voice_pace = 1.0             # >1 = habla mas lento con el mismo tono (el modelo estira cada sonido)
sentence_pause_s = 0.0       # silencio tras cada frase, para que no se atropellen
rag_gate = 0.33                  # offer the buscar_uao tool only above this similarity (chat ~0.15–0.28)
rag_threshold = 0.30             # embeddinggemma: off-topic scores 0.09–0.26, relevant 0.27–0.66 (knowledge/eval.py)
recommend_after_turns = 8        # on this turn the agent suggests programs even if not asked (a friend listens first)

[pc]
threads = 8
whisper_model = "small"
whisper_device = "cuda"
whisper_compute = "float16"  # GPU-native half precision
llm_model = "llama3.2:3b"   # best of the replay test: answers questions, reads through STT errors
llm_num_gpu = 99             # LLM layers offloaded to the GPU; 99 means "all of them"
rag_max_cards = 3            # text chunks per search (~450 words, ~0.3 s on the GPU)
barge_in = false             # set true only when testing with headphones (the speaker would trigger it)
tts_engine = "kokoro"        # natural voice (Piper is faster but sounds more robotic)
tts_device = "cuda"          # Kokoro on the GPU: ~0.5 s per sentence instead of ~3 s on the CPU
voice = "em_santa"           # Kokoro voice (em_ = Spanish male, ef_ = Spanish female)
voice_rate = 1.0             # playback speed factor: <1 = deeper and slower ("character" voice), zero CPU cost

[pi]
threads = 4                  # the Raspberry Pi 5 has 4 CPU cores
whisper_model = "base"
whisper_device = "cpu"
whisper_compute = "int8"     # 8-bit weights: ~2x faster on CPU with tiny accuracy loss
llm_model = "orienta-17b-q8"  # el afinado, Q8_0 1.8 GB: 25.8% de error contra 34.6% de Q4_K_M
llm_num_gpu = 0              # 0 = LLM runs on the CPU only, like on the Pi
# BM25 en la Pi: sin modelo de embeddings cargado y sin ida y vuelta HTTP por turno. Medido el
# 2026-11-16: recuperar baja la tasa de error de 46.5% a 19.7% (fp16, juzgado contra la fuente).
rag_backend = "grafo"
# Medido en la Pi el 2026-11-17: leer el prompt va a ~43 fichas/s y generar a 6.4 fichas/s, asi
# que cada documento recuperado se paga en segundos de espera antes de que el robot hable.
# k=5 con 600 caracteres por documento daba turnos de 13 s; esto da ~9 s. La exactitud casi no
# cambia entre k=3 y k=5 (quedaron dentro de 4 puntos en la medicion del 2026-11-16).
rag_max_cards = 3
rag_card_chars = 0           # ya no hace falta: los fragmentos vienen acotados de origen
rag_fragmentos = 2           # dos franjas de ~260 caracteres en vez de 3 parrafos de ~900
max_tokens = 60              # el modelo fue entrenado para ~20 fichas; 120 lo dejaba divagar 27 s
# Medido el 2026-11-17 en una charla real de 20 turnos: con 10 intercambios el historial llego
# a 605 fichas y la primera palabra paso de 4,7 s en el turno 19 a 30,3 s en el 32. El programa
# en foco ya lo recuerda el grafo, no el historial, asi que recordar menos cuesta muy poco.
max_turns = 3
# La primera muletilla dura 1,9-2,9 s y empieza cuando dejas de hablar; la respuesta llega
# sobre los 7,6 s. A los 3 s la primera ya termino y quedaria un hueco de silencio, asi que
# ahi entra la segunda (slow_filler_due espera igual a que el reproductor se libere).
slow_llm_s = 3.0

# Hardware real de esta Pi, traido de su configuracion propia: la lista son nombres candidatos
# del modulo USB, y la voz mexicana con su ritmo ajustado a mano frente al parlante.
input_device = ["USB PnP MME", "USB PnP Audio Device"]
output_device = ["USB PnP MME", "USB PnP Audio Device"]
voice = "es_MX-claude-high"
voice_pace = 1.12            # >1 = habla mas lento con el mismo tono; Piper por defecto sonaba apurado
sentence_pause_s = 0.35      # silencio tras cada frase: tiempo de respirar
barge_in = false             # the Waveshare module has no hardware echo cancellation
tts_engine = "piper"         # Kokoro is slower than real time on a Pi 5 CPU; Piper is ~4x faster than real time
tts_device = "cpu"           # the Pi has no CUDA GPU
voice_rate = 1.0             # try 0.9 for a wiser, older turtle; costs nothing

[dgx]
# DGX Spark (home) as the brain: run `uv run python server.py dgx`; the Pi connects over Tailscale.
# ARM CPU (Grace): faster-whisper and onnxruntime have no GPU build for ARM, so STT/TTS run on its
# 20 fast cores; the LLM (Ollama) uses the GPU and its 128 GB of unified memory.
threads = 16
whisper_model = "base"       # "small" measured too slow on CPU (same finding already made for [pi]
                              # below: "pi with Whisper small int8 (rejected)" in README's latency table)
whisper_device = "cpu"
whisper_compute = "int8"
llm_backend = "nim"           # container: `docker run --gpus all -p 8001:8000 --env-file .env
                              # --name orienta-nim nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2-dgx-spark:1.0.0-variant`
                              # (needs NGC_API_KEY in .env — docker login alone isn't enough). Revert
                              # to "ollama" (+ `ollama pull qwen2.5:32b`) if it doesn't measure up.
nim_host = "http://127.0.0.1:8001"
llm_model = "nvidia/nemotron-nano-9b-v2"   # confirmed via GET /v1/models on nim_host (2026-09-29)
llm_num_gpu = 99
rag_max_cards = 3
barge_in = false
tts_engine = "kokoro"
tts_device = "cpu"
voice = "em_santa"
voice_rate = 1.0
input_device = "default"     # unused by server.py (audio lives on the Pi)
output_device = "default"
